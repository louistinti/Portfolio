<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--head:start-->
    <meta name="description" content="Louis Tintillier, Product Designer. B2B & SaaS, end to end." />
    <title>Louis Tintillier, Product Designer</title>
    <!--head:end-->
    <script>
      // Avant le premier paint (bloquant, volontairement minuscule) :
      // 1. Redirections : anciens liens #/<slug> → /work/<slug>/. Une URL
      //    garde toujours sa langue (/fr/… = français, le reste = anglais),
      //    sauf la racine nue, qui part en français (/fr/) à moins que le
      //    visiteur ait choisi EN avec le bouton de langue. Les robots ne
      //    sont jamais redirigés : chaque version reste indexable.
      // 2. Drapeau .has-motion (couche d'animations). Filet de sécurité : si
      //    l'app ne démarre pas (JS bloqué/planté), on le retire pour ne pas
      //    laisser le contenu pré-rendu invisible.
      ;(function () {
        var l = location, p = l.pathname, h = l.hash, s = l.search
        var fr = /^\/fr(\/|$)/.test(p)
        var lang = fr ? 'fr' : 'en'
        var rest = fr ? p.slice(3) || '/' : p
        var legacy = h.match(/^#\/([\w-]+)/)
        if (legacy) {
          rest = '/work/' + legacy[1] + '/'
          h = ''
        }
        if (p === '/') {
          var pref = null, bot = false
          try {
            pref = localStorage.getItem('lang')
          } catch (e) {}
          try {
            bot = /bot|crawl|spider|slurp|lighthouse|preview|facebookexternalhit/i.test(navigator.userAgent)
          } catch (e) {}
          lang = pref === 'en' || bot ? 'en' : 'fr'
        }
        var target = (lang === 'fr' ? '/fr' : '') + rest
        if (target !== p && !/[?&]ds\b/.test(s)) {
          l.replace(target + s + h)
          return
        }
        try {
          if (!/[?&]ds\b/.test(s) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            var d = document.documentElement
            d.classList.add('has-motion')
            setTimeout(function () {
              if (!window.__appReady) d.classList.remove('has-motion')
            }, 6000)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
